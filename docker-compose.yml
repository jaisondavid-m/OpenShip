services:
  mysql:
    image: mysql:8.4
    container_name: openship_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - openship_net

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: openship_backend
    restart: unless-stopped
    environment:
      APP_PORT: 8080
      APP_ENV: producation
      CORS_ORIGIN: ${CORS_ORIGIN}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - openship_net
  
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /app/v1
        VITE_IMAGE_BASE_URL: ""
    container_name: openship_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - openship_net

networks:
  openship_net:
    driver: bridge

volumes:
  mysql_data:
  uploads_data: